bootstrap:
  - changed-files:
      - any-glob-to-any-file: "bootstrap/**"

dev:
  - changed-files:
      - any-glob-to-any-file:
          - "bootstrap/dev/**"
          - "environments/dev/**"

prod:
  - changed-files:
      - any-glob-to-any-file:
          - "bootstrap/prod/**"
          - "environments/prod/**"

modules:
  - changed-files:
      - any-glob-to-any-file: "modules/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
